<!DOCTYPE html>
<html>

<head>
<title>Administrador Gonzalo Masoterapia</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Panel Administrador</h2>

<button onclick="cargarTurnos()">Actualizar agenda</button>

<div id="turnos"></div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function cargarTurnos(){

let contenedor=document.getElementById("turnos");

contenedor.innerHTML="";

const snapshot=await getDocs(collection(db,"turnos"));

snapshot.forEach(doc=>{

let turno=doc.data();

let div=document.createElement("div");

div.style.fontSize="20px";
div.style.margin="20px";

div.innerHTML=`
<strong>${turno.nombre}</strong><br>
Tel: ${turno.telefono}<br>
Fecha: ${turno.fecha}<br>
Hora: ${turno.hora}
`;

contenedor.appendChild(div);

});

}

</script>

</body>

</html>
