<!DOCTYPE html>
<html>

<head>

<title>Administrador - Gonzalo Masoterapia</title>

<style>

body{
font-family:Arial;
background:#f7f7f7;
text-align:center;
}

.logo{
width:180px;
margin-top:20px;
}

.login{
margin-top:100px;
}

input{
padding:10px;
font-size:18px;
}

button{
padding:10px 20px;
font-size:18px;
cursor:pointer;
margin:10px;
}

.turno{
background:white;
margin:15px auto;
padding:15px;
width:320px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
font-size:18px;
}

</style>

</head>

<body>

<img src="logo.png" class="logo">

<h2>Administrador</h2>

<div id="login" class="login">

<input type="password" id="pass" placeholder="Contraseña">
<br>
<button onclick="login()">Entrar</button>

</div>

<div id="panel" style="display:none">

<h3>Agenda de turnos</h3>

<input type="date" id="fecha">

<button onclick="cargarTurnos()">Ver turnos</button>

<div id="agenda"></div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs,
query,
where,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const passwordAdmin="gonzalo123";

window.login=function(){

let pass=document.getElementById("pass").value;

if(pass===passwordAdmin){

document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";

}else{

alert("Contraseña incorrecta");

}

}

window.cargarTurnos=async function(){

let fecha=document.getElementById("fecha").value;

let agenda=document.getElementById("agenda");

agenda.innerHTML="Cargando...";

const q=query(
collection(db,"turnos"),
where("fecha","==",fecha)
);

const snapshot=await getDocs(q);

agenda.innerHTML="";

if(snapshot.empty){

agenda.innerHTML="No hay turnos ese día";

return;

}

snapshot.forEach(d=>{

let turno=d.data();

let div=document.createElement("div");

div.className="turno";

div.innerHTML=`

<strong>${turno.hora}</strong><br>

👤 ${turno.nombre}<br>

📱 ${turno.telefono}<br><br>

<button onclick="cancelar('${d.id}')">Cancelar turno</button>

`;

agenda.appendChild(div);

});

}

window.cancelar=async function(id){

if(!confirm("Cancelar turno?")) return;

await deleteDoc(doc(db,"turnos",id));

alert("Turno cancelado");

cargarTurnos();

}

</script>

</body>

</html>
