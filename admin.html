<!DOCTYPE html>
<html>

<head>

<title>Administrador - Gonzalo Masoterapia</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h2>Agenda de Turnos</h2>

<button onclick="cargarTurnos()">Actualizar agenda</button>

<div id="listaTurnos"></div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

async function cargarTurnos(){

let contenedor=document.getElementById("listaTurnos");

contenedor.innerHTML="";

const snapshot=await getDocs(collection(db,"turnos"));

snapshot.forEach(doc=>{

let turno=doc.data();

let card=document.createElement("div");

card.className="turno-card";

card.innerHTML=`
<strong>${turno.nombre}</strong><br>
📱 Tel: ${turno.telefono}<br>
📅 Fecha: ${turno.fecha}<br>
⏰ Hora: ${turno.hora}
`;

contenedor.appendChild(card);

});

}

cargarTurnos();

</script>

</body>

</html>
