<!DOCTYPE html>
<html>

<head>

<title>Administrador - Gonzalo Masoterapia</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
text-align:center;
}

.logo{
width:180px;
margin-top:20px;
}

h2{
margin-top:10px;
}

.login{
margin-top:120px;
}

input{
padding:10px;
font-size:18px;
margin:10px;
}

button{
padding:10px 18px;
font-size:16px;
cursor:pointer;
}

.agenda{
display:grid;
grid-template-columns:repeat(2,200px);
gap:15px;
justify-content:center;
margin-top:30px;
}

.slot{
padding:20px;
border-radius:12px;
color:white;
font-size:18px;
}

.libre{
background:#2ecc71;
}

.ocupado{
background:#e74c3c;
}

.datos{
font-size:14px;
margin-top:8px;
}

</style>

</head>

<body>

<img src="logo.png" class="logo">

<h2>Administrador</h2>

<div id="login" class="login">

<input type="password" id="pass" placeholder="Contraseña">

<br>

<button onclick="login()">Entrar</button>

</div>

<div id="panel" style="display:none">

<h3>Agenda</h3>

<input type="date" id="fecha">

<button onclick="cargarAgenda()">Ver agenda</button>

<div class="agenda" id="agenda"></div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs,
query,
where,
deleteDoc,
doc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const passwordAdmin="gonzalo123";

const horariosBase=[
"09:30",
"11:00",
"14:00",
"15:30"
];

const horarioExtra="17:00";

window.login=function(){

let pass=document.getElementById("pass").value;

if(pass===passwordAdmin){

document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";

}else{

alert("Contraseña incorrecta");

}

}

window.cargarAgenda=async function(){

let fecha=document.getElementById("fecha").value;

let agenda=document.getElementById("agenda");

agenda.innerHTML="Cargando...";

let dia=new Date(fecha+"T00:00").getDay();

if(dia===0 || dia===6){

agenda.innerHTML="No trabajas este día";

return;

}

let horarios=[...horariosBase];

if(dia===1 || dia===3 || dia===5){

horarios.push(horarioExtra);

}

agenda.innerHTML="";

for(let h of horarios){

let div=document.createElement("div");

const q=query(
collection(db,"turnos"),
where("fecha","==",fecha),
where("hora","==",h)
);

const snapshot=await getDocs(q);

if(snapshot.empty){

div.className="slot libre";

div.innerHTML=`${h}<br>Disponible`;

}else{

snapshot.forEach(d=>{

let t=d.data();

div.className="slot ocupado";

div.innerHTML=`
<strong>${h}</strong>

<div class="datos">
👤 ${t.nombre}<br>
📱 ${t.telefono}
</div>

<br>

<button onclick="cancelar('${d.id}')">
Cancelar
</button>
`;

});

}

agenda.appendChild(div);

}

}

window.cancelar=async function(id){

if(!confirm("Cancelar turno?")) return;

await deleteDoc(doc(db,"turnos",id));

alert("Turno cancelado");

cargarAgenda();

}

</script>

</body>

</html>
