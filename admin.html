<!DOCTYPE html>
<html>

<head>

<title>Administrador Gonzalo Masoterapia</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h2>Agenda de Turnos</h2>

<button id="btnActualizar">Actualizar agenda</button>

<div id="turnos"></div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const boton=document.getElementById("btnActualizar");

boton.addEventListener("click", cargarTurnos);

async function cargarTurnos(){

let contenedor=document.getElementById("turnos");

contenedor.innerHTML="Cargando turnos...";

const snapshot=await getDocs(collection(db,"turnos"));

contenedor.innerHTML="";

snapshot.forEach(doc=>{

let turno=doc.data();

let div=document.createElement("div");

div.style.fontSize="22px";
div.style.margin="20px";
div.style.padding="15px";
div.style.border="1px solid #ccc";
div.style.borderRadius="10px";

div.innerHTML=`
<strong>${turno.nombre}</strong><br>
📱 Tel: ${turno.telefono}<br>
📅 Fecha: ${turno.fecha}<br>
⏰ Hora: ${turno.hora}
`;

contenedor.appendChild(div);

});

}

</script>

</body>

</html>
