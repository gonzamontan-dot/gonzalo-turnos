<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador - Gonzalo Masoterapia</title>
  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#eef2f7;
      color:#1f2937;
    }

    .panel-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:min(1200px, 96vw);
      background:white;
      border-radius:22px;
      box-shadow:0 18px 40px rgba(0,0,0,0.12);
      overflow:hidden;
    }

    .panel{
      display:grid;
      grid-template-columns:320px 1fr;
      min-height:80vh;
    }

    .sidebar{
      background:#f8fafc;
      border-right:1px solid #e5e7eb;
      padding:22px;
      overflow:auto;
    }

    .main{
      padding:24px;
    }

    .logo{
      width:min(240px, 70vw);
      height:auto;
      display:block;
      margin:0 auto 18px;
    }

    h1,h2,h3{
      margin:0 0 16px;
    }

    .muted{
      color:#6b7280;
    }

    input{
      width:100%;
      padding:14px 16px;
      font-size:18px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      margin:10px 0;
    }

    button{
      border:none;
      border-radius:12px;
      padding:12px 18px;
      font-size:16px;
      cursor:pointer;
      background:#357ae8;
      color:white;
    }

    button:hover{
      background:#2466cf;
    }

    .danger{
      background:#dc2626;
    }

    .danger:hover{
      background:#b91c1c;
    }

    .secondary{
      background:#4b5563;
    }

    .secondary:hover{
      background:#374151;
    }

    .mes-item{
      background:white;
      border:1px solid #e5e7eb;
      border-radius:12px;
      padding:12px;
      margin-bottom:10px;
      text-align:left;
      font-size:14px;
    }

    .topbar{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      justify-content:center;
      margin-bottom:24px;
    }

    .topbar input{
      max-width:220px;
      margin:0;
    }

    .agenda{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:16px;
    }

    .slot{
      border-radius:16px;
      padding:18px;
      color:white;
      min-height:210px;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }

    .libre{
      background:#22c55e;
    }

    .ocupado{
      background:#ef4444;
    }

    .slot h3{
      margin:0 0 12px;
      font-size:28px;
    }

    .slot p{
      margin:6px 0;
      font-size:16px;
    }

    .manual{
      background:rgba(255,255,255,0.18);
      border-radius:12px;
      padding:10px;
      margin-top:10px;
    }

    .manual input{
      margin:6px 0;
      font-size:15px;
      padding:10px 12px;
      border:none;
    }

    .acciones{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:10px;
    }

    .msg{
      background:#f3f4f6;
      border-radius:12px;
      padding:16px;
      text-align:center;
      color:#374151;
    }

    @media (max-width: 900px){
      .panel{
        grid-template-columns:1fr;
      }

      .sidebar{
        border-right:none;
        border-bottom:1px solid #e5e7eb;
        max-height:300px;
      }
    }
  </style>
</head>
<body>

  <div class="panel-wrap">
    <div class="card panel">
      <aside class="sidebar">
        <img src="logo.png" class="logo" alt="Gonzalo Masoterapia">
        <h3>Turnos del mes</h3>
        <div id="listaMes" class="muted">Cargando...</div>
      </aside>

      <main class="main">
        <h2>Agenda de turnos</h2>

        <div class="topbar">
          <input type="date" id="fecha">
          <button onclick="cargarAgenda()">Ver agenda</button>
        </div>

        <div id="agenda" class="agenda"></div>
      </main>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import {
      collection,
      getDocs,
      query,
      where,
      deleteDoc,
      doc,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const horariosBase = ["09:30","11:00","14:00","15:30"];
    const horarioExtra = "17:00";

    const listaMes = document.getElementById("listaMes");
    const agenda = document.getElementById("agenda");
    const fechaInput = document.getElementById("fecha");

    function parseFechaLocal(fechaStr){
      const [anio, mes, dia] = fechaStr.split("-").map(Number);
      return new Date(anio, mes - 1, dia);
    }

    function horaId(hora){
      return hora.replace(":", "-");
    }

    async function cargarMes(){
      listaMes.innerHTML = "Cargando...";

      try{
        const hoy = new Date();
        const mesActual = hoy.getMonth() + 1;
        const anioActual = hoy.getFullYear();

        const snapshot = await getDocs(collection(db,"turnos"));
        const items = [];

        snapshot.forEach(d => {
          const t = d.data();
          if(!t.fecha) return;

          const [anio, mes] = t.fecha.split("-").map(Number);
          if(anio === anioActual && mes === mesActual){
            items.push({ id: d.id, ...t });
          }
        });

        items.sort((a,b) => {
          const aa = `${a.fecha} ${a.hora}`;
          const bb = `${b.fecha} ${b.hora}`;
          return aa.localeCompare(bb);
        });

        if(items.length === 0){
          listaMes.innerHTML = `<div class="msg">No hay turnos cargados este mes</div>`;
          return;
        }

        listaMes.innerHTML = "";

        items.forEach(t => {
          const div = document.createElement("div");
          div.className = "mes-item";
          div.innerHTML = `
            <strong>${t.fecha}</strong><br>
            ${t.hora} - ${t.nombre}<br>
            📱 ${t.telefono || "-"}
          `;
          listaMes.appendChild(div);
        });
      }catch(error){
        console.error(error);
        listaMes.innerHTML = `<div class="msg">No se pudieron cargar los turnos del mes</div>`;
      }
    }

    window.cargarAgenda = async function(){
      const fecha = fechaInput.value;

      if(!fecha){
        alert("Elegí una fecha");
        return;
      }

      agenda.innerHTML = `<div class="msg">Cargando agenda...</div>`;

      const fechaObj = parseFechaLocal(fecha);
      const dia = fechaObj.getDay();

      if(dia === 0 || dia === 6){
        agenda.innerHTML = `<div class="msg">No trabajás este día</div>`;
        return;
      }

      const horarios = [...horariosBase];
      if([1,3,5].includes(dia)){
        horarios.push(horarioExtra);
      }

      agenda.innerHTML = "";

      for(const hora of horarios){
        const card = document.createElement("div");

        try{
          const q = query(
            collection(db,"turnos"),
            where("fecha","==",fecha),
            where("hora","==",hora)
          );

          const snapshot = await getDocs(q);

          if(snapshot.empty){
            const sufijo = horaId(hora);

            card.className = "slot libre";
            card.innerHTML = `
              <h3>${hora}</h3>
              <p>Disponible</p>

              <div class="manual">
                <input id="nombre-${sufijo}" placeholder="Nombre del cliente">
                <input id="tel-${sufijo}" placeholder="Teléfono del cliente">

                <div class="acciones">
                  <button onclick="crearManual('${fecha}','${hora}')">Reservar manual</button>
                  <button class="secondary" onclick="bloquear('${fecha}','${hora}')">Bloquear</button>
                </div>
              </div>
            `;
          }else{
            snapshot.forEach(d => {
              const t = d.data();

              card.className = "slot ocupado";
              card.innerHTML = `
                <h3>${hora}</h3>
                <p><strong>${t.nombre}</strong></p>
                <p>📱 ${t.telefono || "-"}</p>

                <div class="acciones">
                  <button class="danger" onclick="cancelar('${d.id}')">Cancelar</button>
                </div>
              `;
            });
          }
        }catch(error){
          console.error(error);
          card.className = "slot ocupado";
          card.innerHTML = `
            <h3>${hora}</h3>
            <p>Error al consultar este horario</p>
          `;
        }

        agenda.appendChild(card);
      }
    };

    window.cancelar = async function(id){
      if(!confirm("¿Cancelar turno?")) return;

      try{
        await deleteDoc(doc(db,"turnos",id));
        alert("Turno cancelado");
        await cargarAgenda();
        await cargarMes();
      }catch(error){
        console.error(error);
        alert("No se pudo cancelar el turno");
      }
    };

    window.bloquear = async function(fecha,hora){
      try{
        const check = query(
          collection(db,"turnos"),
          where("fecha","==",fecha),
          where("hora","==",hora)
        );

        const existente = await getDocs(check);
        if(!existente.empty){
          alert("Ese horario ya está ocupado o bloqueado");
          await cargarAgenda();
          return;
        }

        await addDoc(collection(db,"turnos"),{
          nombre:"Bloqueado",
          telefono:"-",
          fecha,
          hora,
          creadoEn:new Date().toISOString()
        });

        alert("Horario bloqueado");
        await cargarAgenda();
        await cargarMes();
      }catch(error){
        console.error(error);
        alert("No se pudo bloquear el horario");
      }
    };

    window.crearManual = async function(fecha,hora){
      const sufijo = horaId(hora);
      const nombreInput = document.getElementById(`nombre-${sufijo}`);
      const telInput = document.getElementById(`tel-${sufijo}`);

      if(!nombreInput){
        alert("No se encontró el campo de nombre");
        return;
      }

      const nombre = nombreInput.value.trim();
      const telefono = telInput ? telInput.value.trim() : "";

      if(!nombre){
        alert("Escribí el nombre del cliente");
        return;
      }

      try{
        const check = query(
          collection(db,"turnos"),
          where("fecha","==",fecha),
          where("hora","==",hora)
        );

        const existente = await getDocs(check);

        if(!existente.empty){
          alert("Ese horario ya está ocupado");
          await cargarAgenda();
          return;
        }

        await addDoc(collection(db,"turnos"),{
          nombre,
          telefono,
          fecha,
          hora,
          creadoEn:new Date().toISOString()
        });

        alert("Turno creado correctamente");
        await cargarAgenda();
        await cargarMes();
      }catch(error){
        console.error(error);
        alert("No se pudo crear el turno");
      }
    };

    cargarMes();
  </script>
</body>
</html>
