<!DOCTYPE html>
<html>

<head>

<title>Administrador - Gonzalo Masoterapia</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f5f8;
display:flex;
}

/* columna izquierda */

.sidebar{
width:320px;
background:white;
height:100vh;
overflow:auto;
box-shadow:2px 0 10px rgba(0,0,0,0.1);
padding:20px;
}

.sidebar h3{
margin-top:0;
}

.turnoMes{
border-bottom:1px solid #eee;
padding:10px;
font-size:15px;
}

/* contenido principal */

.main{
flex:1;
text-align:center;
padding:30px;
}

.logo{
width:160px;
margin-bottom:10px;
}

input{
padding:10px;
font-size:14px;
margin:5px;
width:90%;
}

button{
padding:8px 16px;
font-size:14px;
cursor:pointer;
border:none;
border-radius:6px;
background:#2c7be5;
color:white;
margin-top:5px;
}

button:hover{
background:#1a5fd0;
}

/* agenda */

.agenda{
display:grid;
grid-template-columns:repeat(2,240px);
gap:15px;
justify-content:center;
margin-top:30px;
}

.slot{
padding:20px;
border-radius:12px;
color:white;
font-size:18px;
}

.libre{
background:#2ecc71;
}

.ocupado{
background:#e74c3c;
}

.datos{
font-size:14px;
margin-top:6px;
}

.formManual{
background:white;
padding:10px;
margin-top:10px;
border-radius:8px;
color:black;
}

</style>

</head>

<body>

<div class="sidebar">

<h3>Turnos del mes</h3>

<div id="listaMes"></div>

</div>

<div class="main">

<img src="logo.png" class="logo">

<h2>Administrador</h2>

<input type="date" id="fecha">

<button onclick="cargarAgenda()">Ver agenda</button>

<div class="agenda" id="agenda"></div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs,
query,
where,
deleteDoc,
doc,
addDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const horariosBase=[
"09:30",
"11:00",
"14:00",
"15:30"
];

const horarioExtra="17:00";

cargarMes();

async function cargarMes(){

let lista=document.getElementById("listaMes");

lista.innerHTML="Cargando...";

const snapshot=await getDocs(collection(db,"turnos"));

lista.innerHTML="";

snapshot.forEach(d=>{

let t=d.data();

let div=document.createElement("div");

div.className="turnoMes";

div.innerHTML=`
<strong>${t.fecha}</strong><br>
${t.hora} - ${t.nombre}<br>
📱 ${t.telefono}
`;

lista.appendChild(div);

});

}

window.cargarAgenda=async function(){

let fecha=document.getElementById("fecha").value;

let agenda=document.getElementById("agenda");

let dia=new Date(fecha+"T00:00").getDay();

let horarios=[...horariosBase];

if([1,3,5].includes(dia)){
horarios.push(horarioExtra);
}

agenda.innerHTML="";

for(let h of horarios){

let div=document.createElement("div");

const q=query(
collection(db,"turnos"),
where("fecha","==",fecha),
where("hora","==",h)
);

const snapshot=await getDocs(q);

if(snapshot.empty){

div.className="slot libre";

div.innerHTML=`
<strong>${h}</strong><br>
Disponible

<div class="formManual">

<input id="nombre-${h}" placeholder="Nombre cliente">

<input id="tel-${h}" placeholder="Teléfono">

<button onclick="crearManual('${fecha}','${h}')">
Reservar manual
</button>

<button onclick="bloquear('${fecha}','${h}')">
Bloquear
</button>

</div>
`;

}else{

snapshot.forEach(d=>{

let t=d.data();

div.className="slot ocupado";

div.innerHTML=`
<strong>${h}</strong>

<div class="datos">
${t.nombre}<br>
📱 ${t.telefono}
</div>

<br>

<button onclick="cancelar('${d.id}')">
Cancelar
</button>
`;

});

}

agenda.appendChild(div);

}

}

window.cancelar=async function(id){

if(!confirm("Cancelar turno?")) return;

await deleteDoc(doc(db,"turnos",id));

alert("Turno cancelado");

cargarAgenda();
cargarMes();

}

window.bloquear=async function(fecha,hora){

await addDoc(collection(db,"turnos"),{

nombre:"Bloqueado",
telefono:"-",
fecha:fecha,
hora:hora

});

alert("Horario bloqueado");

cargarAgenda();
cargarMes();

}

window.crearManual=async function(fecha,hora){

let nombre=document.getElementById("nombre-"+hora).value;

let tel=document.getElementById("tel-"+hora).value;

if(nombre==""){

alert("Escribí el nombre del cliente");

return;

}

await addDoc(collection(db,"turnos"),{

nombre:nombre,
telefono:tel,
fecha:fecha,
hora:hora

});

alert("Turno creado");

cargarAgenda();
cargarMes();

}

</script>

</body>

</html>
