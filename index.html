<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gonzalo Masoterapia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="fondo"></div>

  <header class="hero">
    <img src="logo.png" class="logo" alt="Gonzalo Masoterapia">
  </header>

  <main class="container">
    <h2>Reservar turno</h2>

    <label for="fecha">Elegí el día</label>
    <input type="date" id="fecha">

    <div id="horarios" class="horarios"></div>

    <input type="text" id="nombre" placeholder="Tu nombre">
    <input type="tel" id="telefono" placeholder="Tu teléfono">

    <button onclick="reservar()">Reservar turno</button>

    <div class="footer">
      Consulte otros horarios por WhatsApp
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
